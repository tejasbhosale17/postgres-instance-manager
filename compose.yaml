services:
  metadata-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-control_plane}
      POSTGRES_USER: ${POSTGRES_USER:-control_plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - metadata-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  metadata-data:
