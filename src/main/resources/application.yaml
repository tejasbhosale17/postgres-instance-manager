server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: postgres-instance-manager
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/control_plane}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

info:
  app:
    name: PostgreSQL Instance Management Platform
    description: Local development control plane

app:
  security:
    jwt-signing-key: ${JWT_SIGNING_KEY}
    credential-encryption-key: ${CREDENTIAL_ENCRYPTION_KEY}
  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  worker:
    poll-delay-ms: ${WORKER_POLL_DELAY_MS:500}
    lease-duration-seconds: ${WORKER_LEASE_DURATION_SECONDS:120}
    lease-renewal-ms: ${WORKER_LEASE_RENEWAL_MS:30000}
    recovery-delay-ms: ${WORKER_RECOVERY_DELAY_MS:30000}
    reconcile-delay-ms: ${WORKER_RECONCILE_DELAY_MS:60000}
